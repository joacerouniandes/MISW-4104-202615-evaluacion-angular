<table class="table">
  <thead class="table-dark">
    <tr>
      <th>#</th>
      <th>Nombre</th>
      <th>Tipo</th>
      <th>Región</th>
    </tr>
  </thead>
  <tbody>
    @for (coffee of coffees(); track coffee.id) {
      <tr>
        <td>{{coffee.id}}</td>
        <td>{{coffee.nombre}}</td>
        <td>{{coffee.tipo}}</td>
        <td>{{coffee.region}}</td>
      </tr>
    }
  </tbody>
</table>

<p data-test="origin" class="m-0 p-0">Total café de origen: {{originTotal()}}</p>
<p data-test="blend" class="m-0 p-0">Total café blend: {{blendTotal()}}</p>
